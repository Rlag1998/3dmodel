[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "img2mesh"
version = "0.1.0"
description = "Turn a single 2D image into a textured, watertight 3D model on the CPU"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "scipy>=1.10",
    "onnxruntime>=1.16",
    "trimesh>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
img2mesh = "img2mesh.cli:main"

[tool.setuptools]
packages = ["img2mesh"]
